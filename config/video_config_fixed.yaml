# Video Inference Configuration
# Configuration for real-time bag counting system

# Camera Settings
camera:
  buffer_size: 0 # Zero buffer for minimum latency
  fps_limit: 30 # Frame rate cap
  reconnect_attempts: 5 # Max reconnection attempts
  reconnect_delay: 2.0 # Base delay between reconnections (seconds)
  source: "rtsp://admin:Admin%40123@192.168.1.5:554/cam/realmonitor?channel=1&subtype=0&proto=Onvif" # High-quality main stream
  rotation: 0

# Video Playback Settings (for video files, not live camera)
video:
  maintain_original_speed: true
  speed_multiplier: 1.0
  frame_skip: 1

# AI Model Configuration
model:
  weights: "models/weights/best.pt"
  target_class_name: "bag"  # Enforce bag-only class filtering by label name
  confidence: 0.50      # Detection confidence threshold to reduce false positives
  iou: 0.45             # NMS IoU threshold for separating close detections
  imgsz: 320            # Input image size for inference
  frame_skip: 0         # Process every frame for high-speed conveyor
  device: "cpu"         
  half: true            # Enable half-precision if available

# Region of Interest (ROI) - Conveyor belt area only
# Excludes ceiling glare at top and floor edge at bottom
roi:
  enabled: true
  reference_resolution: [1906, 956] # Width, height used when polygon was calibrated
  polygon:
    - [600, 800]    # Left-bottom (Narrower to exclude ceiling lights)
    - [600, 20]     # Left-top
    - [1300, 20]    # Right-top
    - [1300, 800]   # Right-bottom

# Counting Configuration
counting:
  mode: "line"
  line_x: 0.5 # Vertical line exactly in the center
  direction: "both" # Count crossings in both directions to avoid missed bags
  trigger_anchor: "center" # Center is most stable for varying box sizes
  min_area: 5000 # Minimum area for valid bag detection
  max_area: null # Removed max_area - trust confidence and aspect ratio filters
  min_aspect_ratio: 0.2 # Allow wider aspect ratios for bags
  max_aspect_ratio: 5.0 # Allow stretched detections

calibration:
  show_training_zone: true
  show_guideline_boxes: true
  overlay_alpha: 0.3

# Display Settings
display:
  window_name: "Fillpac Bag Counter"
  show_fps: true
  show_count: true
  show_tracking_ids: true
  allow_live_output: false # Do not save MP4 when source is live camera
  performance_mode: false # Disabled to allow diagnostic overlays
  diagnostic_mode: true # Enabled to show low-conf and small-area detections

# Logging Configuration
logging:
  level: "DEBUG" # Increased to watch tracking in logs/inference.log
  file: "logs/inference.log"
  max_bytes: 10485760
  backup_count: 5

# ByteTrack Settings - RTSP-optimised (handles frame drops)
tracking:
  track_activation_threshold: 0.30 # Slightly higher for more stable tracks
  lost_track_buffer: 120            # 4 seconds at 30FPS - survive frame drops
  minimum_matching_threshold: 0.40  # Balanced re-association
  minimum_consecutive_frames: 1    # Instant ID assignment for high speed
  frame_rate: 30                   # Standard base rate

# Pipeline Output (Socket.IO -> Vector -> ELK)
pipeline:
  enabled: false
  socketio_url: "http://localhost:3000"
  socketio_event: "bag_count"
  socketio_namespace: "/"
  socketio_path: "socket.io"
  socketio_transports: ["websocket", "polling"]
  socket_timeout_s: 3.0
  parentid: "TruckLoadingCount"
  commission: "E0-00068100"
  sensorid: "BagsCount"
  sourceid: "Truck01"
  event: "sensor"
  data_source_id: "FP01"
  live_only: true # Push events only for live camera streams
